<!doctype html>
<html lang="en">
  <head>
    <script>
      window.addEventListener("error", function(e) {
        console.error("GLOBAL ERROR:", e.error && e.error.stack ? e.error.stack : e.message);
        var target = e.target || e.srcElement;
        if (target && target.tagName === "SCRIPT" && target.src && target.src.indexOf(".vite/deps") !== -1) {
          var reloadKey = "bjl_vite_dep_reload";
          var lastReload = Number(sessionStorage.getItem(reloadKey) || "0");
          if (Date.now() - lastReload > 10000) {
            sessionStorage.setItem(reloadKey, String(Date.now()));
            window.location.reload();
          }
        }
      }, true);
      window.addEventListener("vite:preloadError", function() {
        var reloadKey = "bjl_vite_preload_reload";
        var lastReload = Number(sessionStorage.getItem(reloadKey) || "0");
        if (Date.now() - lastReload > 10000) {
          sessionStorage.setItem(reloadKey, String(Date.now()));
          window.location.reload();
        }
      });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bally Jute Company Limited</title>
    <meta name="description" content="A comprehensive raw jute management system for Bally Jute Company Limited, featuring arrival tracking (Amad), transaction management (Sauda), and inventory reporting." />
    <!-- Non-blocking Google Fonts with system fallback for offline/LAN networks -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <script>
      (function() {
        try {
          var originalFetch = window.fetch || globalThis.fetch;
          if (originalFetch) {
            var fetchValue = originalFetch;
            var descriptor = {
              get: function() {
                return fetchValue;
              },
              set: function(val) {
                fetchValue = val;
              },
              configurable: true,
              enumerable: true
            };
            Object.defineProperty(window, 'fetch', descriptor);
            if (typeof globalThis !== 'undefined' && globalThis !== window) {
              Object.defineProperty(globalThis, 'fetch', descriptor);
            }
          }
        } catch (e) {
          console.error("Could not define fetch redirect:", e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
