# PostgREST Configuration for Bally Jute (bjcl_db)
# Maps your local PostgreSQL database directly to the REST API expected by the web app

db-uri = "postgres://postgres:YOUR_POSTGRES_PASSWORD@localhost:5432/bjcl_db"
db-schemas = "public"
db-anon-role = "postgres"

# Listen on all interfaces so your router can forward external requests
server-host = "0.0.0.0"
server-port = 8000

# Open CORS so your frontend can communicate freely
server-cors-allowed-origins = "*"
